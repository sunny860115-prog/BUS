<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>307 到站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0e151a;
    --panel:#16222a;
    --panel-2:#1d2c35;
    --line:#2a3d48;
    --cream:#e9e1d2;
    --dim:#8496a0;
    --teal:#5b9ea0;
    --go:#5fb894;
    --hurry:#e0a444;
    --gone:#67767f;
    --walk-min:6;
    --walk-max:8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--cream)}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }

  header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  h1{
    font-family:"Noto Serif TC",serif;font-weight:600;
    font-size:26px;letter-spacing:.06em;
  }
  .sub{color:var(--dim);font-size:12px;letter-spacing:.1em}
  .clock{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

  .walkline{
    margin:14px 0 22px;padding:8px 12px;
    border-left:2px solid var(--teal);
    color:var(--dim);font-size:12.5px;line-height:1.7;
  }
  .walkline b{color:var(--cream);font-weight:500}

  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:2px;margin-bottom:16px;overflow:hidden;
  }
  .card.primary{border-color:var(--teal)}
  .card-head{
    display:flex;align-items:baseline;gap:10px;
    padding:13px 15px;border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  .card-head .what{
    font-family:"Noto Serif TC",serif;font-size:17px;letter-spacing:.08em;
  }
  .card-head .where{color:var(--dim);font-size:11.5px;letter-spacing:.05em;margin-left:auto;text-align:right;line-height:1.5}

  .rows{padding:4px 0}
  .row{padding:13px 15px;border-bottom:1px solid rgba(42,61,72,.5)}
  .row:last-child{border-bottom:none}
  .row-top{display:flex;align-items:flex-end;gap:10px}
  .mins{
    font-size:40px;font-weight:500;line-height:.9;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .unit{font-size:12px;color:var(--dim);padding-bottom:3px}
  .verdict{margin-left:auto;font-size:12.5px;letter-spacing:.08em;padding-bottom:4px}
  .plate{color:var(--dim);font-size:11px;letter-spacing:.05em;margin-top:7px}

  .go .mins,.go .verdict{color:var(--go)}
  .hurry .mins,.hurry .verdict{color:var(--hurry)}
  .gone .mins,.gone .verdict{color:var(--gone)}
  .go .track i{background:var(--go)}
  .hurry .track i{background:var(--hurry)}
  .gone .track i{background:var(--gone)}

  .track{
    position:relative;height:3px;background:#22323c;
    margin-top:11px;border-radius:2px;
  }
  .track i{position:absolute;top:-3px;width:3px;height:9px;border-radius:1px}
  .track .win{
    position:absolute;top:0;height:3px;
    background:rgba(91,158,160,.4);
  }
  .track-key{
    display:flex;justify-content:space-between;
    color:#5b6d77;font-size:9.5px;margin-top:5px;letter-spacing:.04em;
  }

  .msg{padding:18px 15px;color:var(--dim);font-size:13px;line-height:1.8}
  .msg b{color:var(--cream);font-weight:500}

  .setup{
    background:var(--panel);border:1px solid var(--line);
    padding:18px 16px;border-radius:2px;
  }
  .setup h2{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:600;margin-bottom:8px}
  .setup p{color:var(--dim);font-size:12.5px;line-height:1.8;margin-bottom:14px}
  label{display:block;color:var(--dim);font-size:11px;letter-spacing:.08em;margin:0 0 5px}
  input{
    width:100%;background:var(--ink);border:1px solid var(--line);
    color:var(--cream);padding:10px;border-radius:2px;
    font-family:ui-monospace,monospace;font-size:13px;margin-bottom:12px;
  }
  input:focus{outline:2px solid var(--teal);outline-offset:1px}
  button{
    font-family:inherit;font-size:13px;letter-spacing:.06em;
    background:var(--teal);color:#0e151a;border:none;
    padding:10px 18px;border-radius:2px;cursor:pointer;font-weight:500;
  }
  button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  .ghost{background:none;color:var(--dim);border:1px solid var(--line);margin-left:8px}

  footer{margin-top:20px;display:flex;align-items:center;gap:12px}
  footer a{color:var(--dim);font-size:11.5px;text-decoration:none;border-bottom:1px solid var(--line)}
  .err{color:var(--hurry);font-size:12px;line-height:1.7;margin-top:10px}

  @media (prefers-reduced-motion:no-preference){
    .card{animation:in .4s ease both}
    .card:nth-child(2){animation-delay:.06s}
    @keyframes in{from{opacity:0;transform:translateY(6px)}}
  }
</style>

<header>
  <h1>307</h1>
  <span class="sub">西藏三民</span>
  <span class="clock" id="clock"></span>
</header>

<div class="walkline">
  走到站牌大約 <b>6–8 分鐘</b>。<br>
  8 分以上慢慢走，6–8 分該動了，6 分以內等下一班。
</div>

<div id="app"></div>

<footer>
  <a href="https://pda5284.gov.taipei/MQS/stop.jsp?sid=213059" target="_blank">公車處 · 南京三民路口</a>
  <a href="https://pda5284.gov.taipei/MQS/stop.jsp?sid=213071" target="_blank">三民路</a>
</footer>

<script>
const WALK_MIN = 6, WALK_MAX = 8;

const LEGS = [
  { key:'home',  what:'回家',  dir:0, stop:'南京三民路口', where:'去程 往撫遠街<br>南京三民路口' },
  { key:'work',  what:'去公司', dir:1, stop:'三民路',      where:'返程 往板橋<br>三民路' },
];

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] || null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let mem = {};

const app = document.getElementById('app');
let timer = null;

function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tickClock(); setInterval(tickClock, 10000);

/* ---------- setup ---------- */
function showSetup(note){
  clearInterval(timer);
  app.innerHTML = `
    <div class="setup">
      <h2>接上 TDX</h2>
      <p>貼上你在 TDX 會員中心拿到的兩串金鑰。只會存在這台裝置上，不會傳給別人。</p>
      <label>CLIENT ID</label>
      <input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label>CLIENT SECRET</label>
      <input id="csec" type="password" autocomplete="off">
      <button onclick="saveKeys()">存起來</button>
      ${note ? `<div class="err">${note}</div>` : ''}
    </div>`;
}

function saveKeys(){
  const id = document.getElementById('cid').value.trim();
  const sec = document.getElementById('csec').value.trim();
  if(!id || !sec){ return; }
  store.set('tdx_id', id); store.set('tdx_sec', sec); store.del('tdx_tok');
  boot();
}

function forget(){
  ['tdx_id','tdx_sec','tdx_tok','tdx_exp'].forEach(store.del);
  showSetup('');
}

/* ---------- api ---------- */
async function token(){
  const cached = store.get('tdx_tok'), exp = +store.get('tdx_exp') || 0;
  if(cached && Date.now() < exp - 60000) return cached;

  const r = await fetch('https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token',{
    method:'POST',
    headers:{'content-type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({
      grant_type:'client_credentials',
      client_id:store.get('tdx_id'),
      client_secret:store.get('tdx_sec')
    })
  });
  if(r.status === 401 || r.status === 400) throw {kind:'auth'};
  if(!r.ok) throw {kind:'net', code:r.status};
  const j = await r.json();
  store.set('tdx_tok', j.access_token);
  store.set('tdx_exp', String(Date.now() + (j.expires_in||1800)*1000));
  return j.access_token;
}

async function arrivals(){
  const t = await token();
  const head = {authorization:'Bearer ' + t};
  for(const city of ['Taipei','NewTaipei']){
    const url = `https://tdx.transportdata.tw/api/basic/v2/Bus/EstimatedTimeOfArrival/City/${city}/307?%24format=JSON`;
    const r = await fetch(url, {headers:head});
    if(r.status === 401) throw {kind:'auth'};
    if(!r.ok) continue;
    const j = await r.json();
    if(Array.isArray(j) && j.length) return j;
  }
  return [];
}

/* ---------- render ---------- */
function zh(v){ return (v && (v.Zh_tw || v.ZhTw)) || v || ''; }

function classify(mins){
  if(mins === null) return 'gone';
  if(mins >= WALK_MAX) return 'go';
  if(mins >= WALK_MIN) return 'hurry';
  return 'gone';
}
function verdict(mins, status){
  if(status === 1) return '尚未發車';
  if(status === 3) return '末班已過';
  if(status === 4) return '今日未營運';
  if(status === 2) return '不停靠';
  if(mins === null) return '無資料';
  if(mins >= WALK_MAX) return '慢慢走';
  if(mins >= WALK_MIN) return '該走了';
  return '等下一班';
}

function rowHtml(e){
  const secs = e.EstimateTime;
  const mins = (typeof secs === 'number') ? Math.floor(secs/60) : null;
  const st = e.StopStatus;
  const cls = (st && st !== 0) ? 'gone' : classify(mins);
  const shown = (mins === null) ? '—' : mins;
  const capped = Math.min(mins === null ? 20 : mins, 20);
  const pct = m => (Math.min(m,20)/20*100).toFixed(1) + '%';

  return `
    <div class="row ${cls}">
      <div class="row-top">
        <span class="mins">${shown}</span>
        <span class="unit">分</span>
        <span class="verdict">${verdict(mins, st)}</span>
      </div>
      <div class="track">
        <span class="win" style="left:${pct(WALK_MIN)};width:${(WALK_MAX-WALK_MIN)/20*100}%"></span>
        ${mins === null ? '' : `<i style="left:${pct(capped)}"></i>`}
      </div>
      <div class="track-key"><span>現在</span><span>6–8 分 步行窗</span><span>20 分</span></div>
      ${e.PlateNumb && e.PlateNumb !== '-1' ? `<div class="plate">${e.PlateNumb} · ${zh(e.SubRouteName) || '307'}</div>` : ''}
    </div>`;
}

function render(data){
  const hour = new Date().getHours();
  const order = hour < 12 ? ['work','home'] : ['home','work'];

  app.innerHTML = order.map((k,i) => {
    const leg = LEGS.find(l => l.key === k);
    let rows = data
      .filter(e => zh(e.StopName) === leg.stop && e.Direction === leg.dir)
      .sort((a,b) => (a.EstimateTime ?? 1e9) - (b.EstimateTime ?? 1e9))
      .slice(0,3);

    return `
      <div class="card ${i===0?'primary':''}">
        <div class="card-head">
          <span class="what">${leg.what}</span>
          <span class="where">${leg.where}</span>
        </div>
        ${rows.length
          ? `<div class="rows">${rows.map(rowHtml).join('')}</div>`
          : `<div class="msg">目前沒有班次資料。可能是收班了，或這個時段沒有車。</div>`}
      </div>`;
  }).join('')
  + `<footer style="margin-top:4px"><button class="ghost" onclick="forget()">換金鑰</button></footer>`;
}

function fail(e){
  clearInterval(timer);
  if(e && e.kind === 'auth'){
    store.del('tdx_tok');
    showSetup('金鑰被拒絕了。確認一下 Client ID 跟 Secret 有沒有貼完整。');
    return;
  }
  app.innerHTML = `
    <div class="card"><div class="msg">
      <b>連不上 TDX。</b><br>
      可能是網路斷了，或是瀏覽器擋掉了跨網域請求。<br>
      下面兩個公車處的連結還是可以直接看。
    </div></div>`;
}

async function load(){
  try{ render(await arrivals()); }
  catch(e){ fail(e); }
}

function boot(){
  if(!store.get('tdx_id') || !store.get('tdx_sec')){ showSetup(''); return; }
  app.innerHTML = `<div class="card"><div class="msg">讀取中…</div></div>`;
  load();
  clearInterval(timer);
  timer = setInterval(load, 20000);
}

document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
boot();
</script>
